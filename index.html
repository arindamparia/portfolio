  <!-- Dark from the first frame, so the night sky never flashes white -->
  <style>
    html, body { background: #020308; }

    /* Curtain: covers the first frames until the hero is ready (lifted from JS, see src/utils/curtain.js).
       If JavaScript never runs, it lifts by itself after 5s. */
    #curtain {
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: #020308;
      transition: opacity 450ms cubic-bezier(0.23, 1, 0.32, 1);
      animation: curtain-out 450ms ease 5s forwards;
    }
    #curtain::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: #e8ecf8;
      box-shadow: 0 0 12px 3px rgba(232, 236, 248, 0.55);
      animation: curtain-star 1.6s ease-in-out infinite alternate;
    }
    #curtain.lifted { opacity: 0; pointer-events: none; }
    @keyframes curtain-out { to { opacity: 0; visibility: hidden; } }
    @keyframes curtain-star { from { opacity: 0.25; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #curtain::after { animation: none; } }
  </style>
